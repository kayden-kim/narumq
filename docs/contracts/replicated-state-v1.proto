syntax = "proto3";

package narumq.cluster.v1;

option go_package = "narumq/internal/adapters/raft/records;records";

// Draft state schema 1.0 rejects unknown fields. Mixed-release membership is
// unsupported; retained, offline, and delivery commands are admitted only when every active
// committed member's exact release, cluster protocol, and state schema match locally.

enum MemberPhase {
  MEMBER_PHASE_UNSPECIFIED = 0;
  MEMBER_PHASE_STAGED = 1;
  MEMBER_PHASE_LEARNER = 2;
  MEMBER_PHASE_CATCHING_UP = 3;
  MEMBER_PHASE_VOTER = 4;
  MEMBER_PHASE_LEAVING = 5;
  MEMBER_PHASE_RETIRED = 6;
}

enum MembershipAction {
  MEMBERSHIP_ACTION_UNSPECIFIED = 0;
  MEMBERSHIP_ACTION_STAGE_JOIN = 1;
  MEMBERSHIP_ACTION_ADD_LEARNER = 2;
  MEMBERSHIP_ACTION_PROMOTE_VOTER = 3;
  MEMBERSHIP_ACTION_BEGIN_REMOVE = 4;
  MEMBERSHIP_ACTION_REMOVE_MEMBER = 5;
  MEMBERSHIP_ACTION_ABORT_STAGE = 6;
}

enum OwnershipAction {
  OWNERSHIP_ACTION_UNSPECIFIED = 0;
  OWNERSHIP_ACTION_ACQUIRE = 1;
  OWNERSHIP_ACTION_TRANSFER = 2;
  OWNERSHIP_ACTION_RELEASE = 3;
}

enum SubscriptionAction {
  SUBSCRIPTION_ACTION_UNSPECIFIED = 0;
  SUBSCRIPTION_ACTION_ADD = 1;
  SUBSCRIPTION_ACTION_REMOVE = 2;
}

enum RetainedAction {
  RETAINED_ACTION_UNSPECIFIED = 0;
  RETAINED_ACTION_REPLACE = 1;
  RETAINED_ACTION_DELETE = 2;
}

enum OfflineAction {
  OFFLINE_ACTION_UNSPECIFIED = 0;
  OFFLINE_ACTION_DETACH = 1;
  OFFLINE_ACTION_ENQUEUE = 2;
  OFFLINE_ACTION_CLAIM = 3;
}


enum DeliveryAction {
  DELIVERY_ACTION_UNSPECIFIED = 0;
  DELIVERY_ACTION_PUBLISH = 1;
  DELIVERY_ACTION_RECEIVE = 2;
  DELIVERY_ACTION_RELEASE = 3;
  DELIVERY_ACTION_SEND = 4;
  DELIVERY_ACTION_ADVANCE = 5;
  DELIVERY_ACTION_COMPLETE = 6;
  DELIVERY_ACTION_ATTACH = 7;
  DELIVERY_ACTION_DETACH = 8;
  DELIVERY_ACTION_DISCARD = 9;
}

enum DeliveryPhase {
  DELIVERY_PHASE_UNSPECIFIED = 0;
  DELIVERY_PHASE_QUEUED = 1;
  DELIVERY_PHASE_AWAIT_PUBACK = 2;
  DELIVERY_PHASE_AWAIT_PUBREC = 3;
  DELIVERY_PHASE_AWAIT_PUBCOMP = 4;
}

// Every application log entry has exactly one typed payload. operation_id is a
// canonical lower-case UUID and is stable across retry of the same operation.
message CommandEnvelope {
  uint32 schema_major = 1;
  uint32 schema_minor = 2;
  string operation_id = 3;
  oneof payload {
    MembershipRecord membership = 10;
    OwnershipChange ownership = 11;
    SubscriptionChange subscription = 12;
    DeliveryChange delivery = 16;
    RetainedChange retained = 14;
    OfflineChange offline = 15;
  }
  reserved 13;
  reserved "checkpoint";

}

// Identity fields are committed before the candidate can send a Raft message.
message MemberIdentity {
  uint64 member_id = 1;
  string cluster_id = 2;
  string address = 3;
  string dns_san = 4;
  bytes certificate_sha256 = 5;
  string release_version = 6;
  uint32 cluster_protocol_major = 7;
  uint32 cluster_protocol_minor = 8;
  uint32 state_schema_major = 9;
  uint32 state_schema_minor = 10;
  MemberPhase phase = 11;
  string operation_id = 12;
}

// The idempotency key is stored with the stage record so a lost HTTP reply does
// not create a second operation. target_member_id is used only by remove work.
message MembershipRecord {
  string operation_id = 1;
  MembershipAction action = 2;
  string idempotency_key = 3;
  MemberIdentity member = 4;
  uint64 target_member_id = 5;
  uint64 expected_conf_state_index = 6;
  // Snapshot history stores the actual committed index of this transition.
  // Command payloads must leave this field zero; adapters derive it from the
  // committed Raft entry before taking a snapshot.
  uint64 committed_index = 7;
}

message OwnershipChange {
  string tenant_id = 1;
  string client_id = 2;
  uint64 expected_epoch = 3;
  uint64 owner_node_id = 4;
  uint64 epoch = 5;
  OwnershipAction action = 6;
}

message OwnershipState {
  string tenant_id = 1;
  string client_id = 2;
  uint64 owner_node_id = 3;
  uint64 epoch = 4;
  uint64 committed_index = 5;
}

message SubscriptionChange {
  string tenant_id = 1;
  string client_id = 2;
  uint64 owner_node_id = 3;
  uint64 epoch = 4;
  string filter = 5;
  uint32 qos = 6;
  bool no_local = 7;
  bool retain_as_published = 8;
  uint32 retain_handling = 9;
  SubscriptionAction action = 10;
}


message DeliveryTarget {
  string client_id = 1;
  bool retain = 2;
}

message DeliveryChange {
  string tenant_id = 1;
  string client_id = 2;
  uint64 owner_node_id = 3;
  uint64 epoch = 4;
  DeliveryAction action = 5;
  uint64 proposed_at_unix_millis = 6;
  string topic = 7;
  bytes payload = 8;
  bool retain = 9;
  uint64 expires_at_unix_millis = 10;
  uint32 packet_id = 11;
  repeated DeliveryTarget targets = 12;
  uint64 sequence = 13;
  bool reset = 14;
  uint64 session_expires_at_unix_millis = 15;
  uint32 publish_qos = 16;
}

message DeliveryMessage {
  uint64 sequence = 1;
  string topic = 2;
  bytes payload = 3;
  uint32 qos = 4;
  bool retain = 5;
  uint64 expires_at_unix_millis = 6;
  uint32 packet_id = 7;
  DeliveryPhase phase = 8;
}

message InboundMessage {
  uint32 packet_id = 1;
  string topic = 2;
  bytes payload = 3;
  bool retain = 4;
  uint64 expires_at_unix_millis = 5;
  bool released = 6;
  uint64 released_index = 7;
}

message DeliverySessionState {
  string tenant_id = 1;
  string client_id = 2;
  uint64 session_expires_at_unix_millis = 3;
  uint64 next_sequence = 4;
  repeated DeliveryMessage messages = 5;
  repeated InboundMessage inbound = 6;
}

// Retained values are keyed by (tenant_id, topic). Timestamps are proposer Unix
// milliseconds; apply purges values with 0 < expires_at <= proposed_at.
message RetainedChange {
  string tenant_id = 1;
  string topic = 2;
  string publisher_client_id = 3;
  uint32 qos = 4;
  bytes payload = 5;
  uint64 expires_at_unix_millis = 6;
  uint64 proposed_at_unix_millis = 7;
  RetainedAction action = 8;
}

message RetainedState {
  string tenant_id = 1;
  string topic = 2;
  string publisher_client_id = 3;
  uint32 qos = 4;
  bytes payload = 5;
  uint64 expires_at_unix_millis = 6;
}

// Offline entries belong to detached persistent sessions keyed by (tenant_id, client_id).
// Timestamps are proposer Unix milliseconds; apply purges 0 < expires_at <= proposed_at.
message OfflineMessage {
  uint64 sequence = 1;
  string topic = 2;
  bytes payload = 3;
  uint32 qos = 4;
  bool retain = 5;
  uint64 expires_at_unix_millis = 6;
}

message OfflineChange {
  string tenant_id = 1;
  string client_id = 2;
  uint64 owner_node_id = 3;
  uint64 epoch = 4;
  OfflineAction action = 5;
  uint64 session_expires_at_unix_millis = 6;
  uint64 proposed_at_unix_millis = 7;
  repeated OfflineMessage messages = 8;
}

message OfflineSessionState {
  string tenant_id = 1;
  string client_id = 2;
  uint64 epoch = 3;
  uint64 session_expires_at_unix_millis = 4;
  uint64 next_sequence = 5;
  repeated OfflineMessage messages = 6;
}

message SubscriptionState {
  string tenant_id = 1;
  string client_id = 2;
  uint64 owner_node_id = 3;
  uint64 epoch = 4;
  string filter = 5;
  uint32 qos = 6;
  bool no_local = 7;
  bool retain_as_published = 8;
  uint32 retain_handling = 9;
}

message ReplicatedStateSnapshot {
  repeated MemberIdentity members = 1;
  repeated OwnershipState ownerships = 2;
  repeated SubscriptionState subscriptions = 3;
  reserved 4;
  reserved "checkpoints";
  repeated MembershipRecord membership_history = 5;
  repeated RetainedState retained = 6;
  repeated OfflineSessionState offline_sessions = 7;
  repeated DeliverySessionState delivery_sessions = 8;
}

message SnapshotEnvelope {
  uint32 schema_major = 1;
  uint32 schema_minor = 2;
  uint64 last_included_index = 3;
  uint64 object_count = 4;
  bytes sha256 = 5;
  ReplicatedStateSnapshot state = 6;
}
