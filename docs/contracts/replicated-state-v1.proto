syntax = "proto3";

package narumq.cluster.v1;

option go_package = "narumq/internal/adapters/raft/records;records";

// State schema 1.0 is fixed and strict: consumers reject unknown fields, payloads and
// versions. Additive changes follow replicated-state-v1.md §3 and are written only after
// their required feature is active. Session metadata requires `session-metadata`; connection
// rebalance requires `connection-rebalance`; credential revocation requires
// `credential-revocation`; client blocklist requires `client-blocklist`; cluster policy requires
// `cluster-policy`; policy tenant quotas require `cluster-policy-tenant-quotas`; shared-subscription
// origin (`DeliveryTarget.shared_filter`, `DeliveryMessage.shared_filter`) requires
// `shared-subscription-reroute`.

enum MemberPhase {
  MEMBER_PHASE_UNSPECIFIED = 0;
  MEMBER_PHASE_STAGED = 1;
  MEMBER_PHASE_LEARNER = 2;
  MEMBER_PHASE_CATCHING_UP = 3;
  MEMBER_PHASE_VOTER = 4;
  MEMBER_PHASE_LEAVING = 5;
  MEMBER_PHASE_RETIRED = 6;
}

enum MembershipAction {
  MEMBERSHIP_ACTION_UNSPECIFIED = 0;
  MEMBERSHIP_ACTION_STAGE_JOIN = 1;
  MEMBERSHIP_ACTION_ADD_LEARNER = 2;
  MEMBERSHIP_ACTION_PROMOTE_VOTER = 3;
  MEMBERSHIP_ACTION_BEGIN_REMOVE = 4;
  MEMBERSHIP_ACTION_REMOVE_MEMBER = 5;
  MEMBERSHIP_ACTION_ABORT_STAGE = 6;
}

enum OwnershipAction {
  OWNERSHIP_ACTION_UNSPECIFIED = 0;
  OWNERSHIP_ACTION_ACQUIRE = 1;
  OWNERSHIP_ACTION_TRANSFER = 2;
  OWNERSHIP_ACTION_RELEASE = 3;
}

enum SubscriptionAction {
  SUBSCRIPTION_ACTION_UNSPECIFIED = 0;
  SUBSCRIPTION_ACTION_ADD = 1;
  SUBSCRIPTION_ACTION_REMOVE = 2;
}

enum RetainedAction {
  RETAINED_ACTION_UNSPECIFIED = 0;
  RETAINED_ACTION_REPLACE = 1;
  RETAINED_ACTION_DELETE = 2;
}

enum OfflineAction {
  OFFLINE_ACTION_UNSPECIFIED = 0;
  OFFLINE_ACTION_DETACH = 1;
  OFFLINE_ACTION_ENQUEUE = 2;
  OFFLINE_ACTION_CLAIM = 3;
}


enum DeliveryAction {
  DELIVERY_ACTION_UNSPECIFIED = 0;
  DELIVERY_ACTION_PUBLISH = 1;
  DELIVERY_ACTION_RECEIVE = 2;
  DELIVERY_ACTION_RELEASE = 3;
  DELIVERY_ACTION_SEND = 4;
  DELIVERY_ACTION_ADVANCE = 5;
  DELIVERY_ACTION_COMPLETE = 6;
  DELIVERY_ACTION_ATTACH = 7;
  DELIVERY_ACTION_DETACH = 8;
  DELIVERY_ACTION_DISCARD = 9;
}

enum DeliveryPhase {
  DELIVERY_PHASE_UNSPECIFIED = 0;
  DELIVERY_PHASE_QUEUED = 1;
  DELIVERY_PHASE_AWAIT_PUBACK = 2;
  DELIVERY_PHASE_AWAIT_PUBREC = 3;
  DELIVERY_PHASE_AWAIT_PUBCOMP = 4;
}

enum NodeDrainAction {
  NODE_DRAIN_ACTION_UNSPECIFIED = 0;
  NODE_DRAIN_ACTION_START = 1;
  NODE_DRAIN_ACTION_ADVANCE = 2;
  NODE_DRAIN_ACTION_COMPLETE = 3;
  NODE_DRAIN_ACTION_FAIL = 4;
  NODE_DRAIN_ACTION_CANCEL = 5;
  NODE_DRAIN_ACTION_CLEAR = 6;
}

enum NodeDrainPhase {
  NODE_DRAIN_PHASE_UNSPECIFIED = 0;
  NODE_DRAIN_PHASE_EXCLUDING_TRAFFIC = 1;
  NODE_DRAIN_PHASE_WAITING_FOR_LB = 2;
  NODE_DRAIN_PHASE_VERIFYING_SESSION_STATE = 3;
  NODE_DRAIN_PHASE_TRANSFERRING_SESSIONS = 4;
  NODE_DRAIN_PHASE_VERIFYING_BARRIER = 5;
  NODE_DRAIN_PHASE_COMPLETED = 6;
  NODE_DRAIN_PHASE_FAILED = 7;
  NODE_DRAIN_PHASE_CANCELLED = 8;
}

message NodeDrainProgress {
  uint64 connections_initial = 1;
  uint64 connections_remaining = 2;
  uint64 sessions_ready_for_takeover = 3;
  uint64 sessions_taken_over = 4;
  uint64 sessions_failed = 5;
  uint64 pending_wal = 6;
  uint64 under_replicated = 7;
}

message NodeDrainChange {
  NodeDrainAction action = 1;
  uint64 member_id = 2;
  string drain_operation_id = 3;
  string idempotency_key = 4;
  string server_reference = 5;
  uint32 connection_rate_per_second = 6;
  uint64 load_balancer_propagation_delay_millis = 7;
  uint64 timeout_millis = 8;
  NodeDrainPhase phase = 9;
  NodeDrainProgress progress = 10;
  string failure_code = 11;
  string blocking_reason = 12;
  uint64 proposed_at_unix_millis = 13;
}

message NodeDrainState {
  string drain_operation_id = 1;
  uint64 member_id = 2;
  string idempotency_key = 3;
  NodeDrainPhase phase = 4;
  string server_reference = 5;
  uint32 connection_rate_per_second = 6;
  uint64 load_balancer_propagation_delay_millis = 7;
  uint64 timeout_millis = 8;
  uint64 started_at_unix_millis = 9;
  uint64 deadline_at_unix_millis = 10;
  uint64 phase_started_at_unix_millis = 11;
  NodeDrainProgress progress = 12;
  string failure_code = 13;
  string blocking_reason = 14;
  uint64 committed_index = 15;
}

enum SessionRetention {
  SESSION_RETENTION_UNSPECIFIED = 0;
  SESSION_RETENTION_IMMEDIATE = 1;
  SESSION_RETENTION_FINITE = 2;
  SESSION_RETENTION_INFINITE = 3;
}

enum SessionMetadataAction {
  SESSION_METADATA_ACTION_UNSPECIFIED = 0;
  SESSION_METADATA_ACTION_DETACH = 1;
  SESSION_METADATA_ACTION_CLAIM_WILL = 2;
  SESSION_METADATA_ACTION_DISCARD = 3;
}

enum SessionWillDisposition {
  SESSION_WILL_DISPOSITION_UNSPECIFIED = 0;
  SESSION_WILL_DISPOSITION_DISCARD = 1;
  SESSION_WILL_DISPOSITION_CLAIM = 2;
  SESSION_WILL_DISPOSITION_SCHEDULE = 3;
}

message SessionWill {
  string topic = 1;
  bytes payload = 2;
  uint32 qos = 3;
  bool retain = 4;
  uint32 delay_interval_seconds = 5;
}

message SessionPrincipal {
  string subject = 1;
  string credential_id = 2;
  repeated string roles = 3;
  uint64 expires_at_unix_millis = 4;
}

message SessionConnect {
  uint32 protocol_version = 1;
  SessionRetention retention = 2;
  uint32 expiry_interval_seconds = 3;
  SessionWill will = 4;
  SessionPrincipal principal = 5;
}

message SessionMetadataChange {
  string tenant_id = 1;
  string client_id = 2;
  uint64 owner_node_id = 3;
  uint64 epoch = 4;
  SessionMetadataAction action = 5;
  SessionWillDisposition will_disposition = 6;
  uint64 proposed_at_unix_millis = 7;
  uint64 session_expires_at_unix_millis = 8;
  uint64 will_due_at_unix_millis = 9;
}

message SessionMetadataState {
  string tenant_id = 1;
  string client_id = 2;
  uint64 epoch = 3;
  uint32 protocol_version = 4;
  SessionRetention retention = 5;
  uint32 expiry_interval_seconds = 6;
  bool connected = 7;
  uint64 detached_at_unix_millis = 8;
  uint64 session_expires_at_unix_millis = 9;
  SessionWill will = 10;
  uint64 will_due_at_unix_millis = 11;
  SessionPrincipal principal = 12;
}

enum ConnectionRebalanceAction {
  CONNECTION_REBALANCE_ACTION_UNSPECIFIED = 0;
  CONNECTION_REBALANCE_ACTION_START = 1;
  CONNECTION_REBALANCE_ACTION_REPORT = 2;
  CONNECTION_REBALANCE_ACTION_FAIL = 3;
  CONNECTION_REBALANCE_ACTION_CANCEL = 4;
}

enum ConnectionRebalancePhase {
  CONNECTION_REBALANCE_PHASE_UNSPECIFIED = 0;
  CONNECTION_REBALANCE_PHASE_RUNNING = 1;
  CONNECTION_REBALANCE_PHASE_COMPLETED = 2;
  CONNECTION_REBALANCE_PHASE_FAILED = 3;
  CONNECTION_REBALANCE_PHASE_CANCELLED = 4;
}

message ConnectionRebalanceReport {
  uint64 node_id = 1;
  uint64 connections = 2;
  uint64 sessions_transferred = 3;
  bool shedding = 4;
  uint64 reported_at_unix_millis = 5;
}

message ConnectionRebalanceChange {
  ConnectionRebalanceAction action = 1;
  string rebalance_operation_id = 2;
  string idempotency_key = 3;
  string server_reference = 4;
  uint64 max_deviation_connections = 5;
  uint32 connection_rate_per_second = 6;
  uint64 load_balancer_propagation_delay_millis = 7;
  uint64 timeout_millis = 8;
  uint64 node_id = 9;
  uint64 connections = 10;
  uint64 sessions_transferred = 11;
  bool shedding = 12;
  string failure_code = 13;
  uint64 proposed_at_unix_millis = 14;
}

message ConnectionRebalanceState {
  string rebalance_operation_id = 1;
  string idempotency_key = 2;
  ConnectionRebalancePhase phase = 3;
  string server_reference = 4;
  uint64 max_deviation_connections = 5;
  uint32 connection_rate_per_second = 6;
  uint64 load_balancer_propagation_delay_millis = 7;
  uint64 timeout_millis = 8;
  uint64 started_at_unix_millis = 9;
  uint64 deadline_at_unix_millis = 10;
  uint64 finished_at_unix_millis = 11;
  repeated ConnectionRebalanceReport participants = 12;
  string failure_code = 13;
  uint64 committed_index = 14;
}

enum CredentialRevocationAction {
  CREDENTIAL_REVOCATION_ACTION_UNSPECIFIED = 0;
  CREDENTIAL_REVOCATION_ACTION_REVOKE = 1;
  CREDENTIAL_REVOCATION_ACTION_RESTORE = 2;
}

message CredentialRevocationChange {
  CredentialRevocationAction action = 1;
  string credential_id = 2;
  uint64 proposed_at_unix_millis = 3;
}

message CredentialRevocationState {
  string credential_id = 1;
  uint64 revoked_at_unix_millis = 2;
}

enum BlocklistKind {
  BLOCKLIST_KIND_UNSPECIFIED = 0;
  BLOCKLIST_KIND_CLIENT_ID = 1;
  BLOCKLIST_KIND_USERNAME = 2;
  BLOCKLIST_KIND_CERTIFICATE_SHA256 = 3;
  BLOCKLIST_KIND_IP_PREFIX = 4;
}

enum BlocklistAction {
  BLOCKLIST_ACTION_UNSPECIFIED = 0;
  BLOCKLIST_ACTION_BLOCK = 1;
  BLOCKLIST_ACTION_UNBLOCK = 2;
}

message BlocklistEntry {
  BlocklistKind kind = 1;
  string tenant_id = 2;
  string value = 3;
}

message BlocklistChange {
  BlocklistAction action = 1;
  BlocklistEntry entry = 2;
  uint64 proposed_at_unix_millis = 3;
}

message BlocklistState {
  BlocklistEntry entry = 1;
  uint64 blocked_at_unix_millis = 2;
}
message MqttLimits {
  uint32 max_packet_size = 1;
  uint32 receive_maximum = 2;
  uint32 connect_timeout_millis = 3;
  uint32 packet_read_timeout_millis = 4;
  uint32 write_timeout_millis = 5;
}

message ClusterTenantQuotas {
  TenantStorageQuota default_quota = 1;
  repeated TenantStorageQuota tenant_quotas = 2;
}

message ClusterPolicy {
  MqttLimits mqtt_limits = 1;
  ClusterTenantQuotas tenant_quotas = 2;
}

message ClusterPolicyChange {
  uint64 expected_version = 1;
  uint64 version = 2;
  ClusterPolicy policy = 3;
  string idempotency_key = 4;
}

message ClusterPolicyState {
  uint64 version = 1;
  ClusterPolicy policy = 2;
  string idempotency_key = 3;
  uint64 previous_version = 4;
}

// Every application log entry has exactly one typed payload. operation_id is a
// canonical lower-case UUID and is stable across retry of the same operation.
message CommandEnvelope {
  uint32 schema_major = 1;
  uint32 schema_minor = 2;
  string operation_id = 3;
  oneof payload {
    MembershipRecord membership = 10;
    OwnershipChange ownership = 11;
    SubscriptionChange subscription = 12;
    DeliveryChange delivery = 16;
    RetainedChange retained = 14;
    OfflineChange offline = 15;
    NodeDrainChange node_drain = 17;
    TenantQuotaChange tenant_quota = 18;
    MemberProfileChange member_profile = 19;
    FeatureActivation feature_activation = 20;
    SessionMetadataChange session_metadata = 21;
    ConnectionRebalanceChange connection_rebalance = 22;
    CredentialRevocationChange credential_revocation = 25;
    BlocklistChange blocklist = 26;
    ClusterPolicyChange cluster_policy = 27;
  }
  reserved 13;
  reserved "checkpoint";
  reserved 23;
  ProposalIdentity proposal = 24;

}

// Identity fields are committed before the candidate can send a Raft message.
// Release version and features are mutable profile fields.
message MemberIdentity {
  uint64 member_id = 1;
  string cluster_id = 2;
  string address = 3;
  string dns_san = 4;
  bytes certificate_sha256 = 5;
  string release_version = 6;
  uint32 cluster_protocol_major = 7;
  uint32 cluster_protocol_minor = 8;
  uint32 state_schema_major = 9;
  uint32 state_schema_minor = 10;
  MemberPhase phase = 11;
  string operation_id = 12;
  repeated string features = 13;
}

// The idempotency key is stored with the stage record so a lost HTTP reply does
// not create a second operation. target_member_id is used only by remove work.
message MembershipRecord {
  string operation_id = 1;
  MembershipAction action = 2;
  string idempotency_key = 3;
  MemberIdentity member = 4;
  uint64 target_member_id = 5;
  uint64 expected_conf_state_index = 6;
  // Snapshot history stores the actual committed index of this transition.
  // Command payloads must leave this field zero; adapters derive it from the
  // committed Raft entry before taking a snapshot.
  uint64 committed_index = 7;
}

message OwnershipChange {
  string tenant_id = 1;
  string client_id = 2;
  uint64 expected_epoch = 3;
  uint64 owner_node_id = 4;
  uint64 epoch = 5;
  OwnershipAction action = 6;
  SessionConnect session = 7;
}

message OwnershipState {
  string tenant_id = 1;
  string client_id = 2;
  uint64 owner_node_id = 3;
  uint64 epoch = 4;
  uint64 committed_index = 5;
}

message SubscriptionChange {
  string tenant_id = 1;
  string client_id = 2;
  uint64 owner_node_id = 3;
  uint64 epoch = 4;
  string filter = 5;
  uint32 qos = 6;
  bool no_local = 7;
  bool retain_as_published = 8;
  uint32 retain_handling = 9;
  SubscriptionAction action = 10;
}


message DeliveryTarget {
  string client_id = 1;
  bool retain = 2;
  // `$share/<group>/<filter>` that selected this target; empty for non-shared targets.
  string shared_filter = 3;
}

message DeliveryChange {
  string tenant_id = 1;
  string client_id = 2;
  uint64 owner_node_id = 3;
  uint64 epoch = 4;
  DeliveryAction action = 5;
  uint64 proposed_at_unix_millis = 6;
  string topic = 7;
  bytes payload = 8;
  bool retain = 9;
  uint64 expires_at_unix_millis = 10;
  uint32 packet_id = 11;
  repeated DeliveryTarget targets = 12;
  uint64 sequence = 13;
  bool reset = 14;
  uint64 session_expires_at_unix_millis = 15;
  uint32 publish_qos = 16;
}

message DeliveryMessage {
  uint64 sequence = 1;
  string topic = 2;
  bytes payload = 3;
  uint32 qos = 4;
  bool retain = 5;
  uint64 expires_at_unix_millis = 6;
  uint32 packet_id = 7;
  DeliveryPhase phase = 8;
  // Shared-subscription origin of the queued message; empty when the message has none.
  string shared_filter = 9;
}

message InboundMessage {
  uint32 packet_id = 1;
  string topic = 2;
  bytes payload = 3;
  bool retain = 4;
  uint64 expires_at_unix_millis = 5;
  bool released = 6;
  uint64 released_index = 7;
}

message DeliverySessionState {
  string tenant_id = 1;
  string client_id = 2;
  uint64 session_expires_at_unix_millis = 3;
  uint64 next_sequence = 4;
  repeated DeliveryMessage messages = 5;
  repeated InboundMessage inbound = 6;
}

// Retained values are keyed by (tenant_id, topic). Timestamps are proposer Unix
// milliseconds; apply purges values with 0 < expires_at <= proposed_at.
message RetainedChange {
  string tenant_id = 1;
  string topic = 2;
  string publisher_client_id = 3;
  uint32 qos = 4;
  bytes payload = 5;
  uint64 expires_at_unix_millis = 6;
  uint64 proposed_at_unix_millis = 7;
  RetainedAction action = 8;
}

message RetainedState {
  string tenant_id = 1;
  string topic = 2;
  string publisher_client_id = 3;
  uint32 qos = 4;
  bytes payload = 5;
  uint64 expires_at_unix_millis = 6;
}

// A quota profile is versioned and sorted by tenant_id. The empty tenant_id on
// default_quota identifies the fallback limit applied to omitted tenants.
message TenantStorageQuota {
  string tenant_id = 1;
  uint64 retained_bytes = 2;
  uint64 offline_queue_messages = 3;
  uint64 offline_queue_bytes = 4;
  uint64 storage_bytes = 5;
}

message TenantQuotaProfile {
  uint64 version = 1;
  TenantStorageQuota default_quota = 2;
  repeated TenantStorageQuota tenants = 3;
}

message TenantQuotaChange {
  TenantQuotaProfile profile = 1;
}

message MemberProfileChange {
  uint64 member_id = 1;
  string release_version = 2;
  repeated string features = 3;
}

message FeatureActivation {
  string feature = 1;
}

// Offline entries belong to detached persistent sessions keyed by (tenant_id, client_id).
// Timestamps are proposer Unix milliseconds; apply purges 0 < expires_at <= proposed_at.

message OfflineMessage {
  uint64 sequence = 1;
  string topic = 2;
  bytes payload = 3;
  uint32 qos = 4;
  bool retain = 5;
  uint64 expires_at_unix_millis = 6;
}

message OfflineChange {
  string tenant_id = 1;
  string client_id = 2;
  uint64 owner_node_id = 3;
  uint64 epoch = 4;
  OfflineAction action = 5;
  uint64 session_expires_at_unix_millis = 6;
  uint64 proposed_at_unix_millis = 7;
  repeated OfflineMessage messages = 8;
}

message OfflineSessionState {
  string tenant_id = 1;
  string client_id = 2;
  uint64 epoch = 3;
  uint64 session_expires_at_unix_millis = 4;
  uint64 next_sequence = 5;
  repeated OfflineMessage messages = 6;
}

message SubscriptionState {
  string tenant_id = 1;
  string client_id = 2;
  uint64 owner_node_id = 3;
  uint64 epoch = 4;
  string filter = 5;
  uint32 qos = 6;
  bool no_local = 7;
  bool retain_as_published = 8;
  uint32 retain_handling = 9;
}

message ReplicatedStateSnapshot {
  repeated MemberIdentity members = 1;
  repeated OwnershipState ownerships = 2;
  repeated SubscriptionState subscriptions = 3;
  reserved 4;
  reserved "checkpoints";
  repeated MembershipRecord membership_history = 5;
  repeated RetainedState retained = 6;
  repeated OfflineSessionState offline_sessions = 7;
  repeated DeliverySessionState delivery_sessions = 8;
  repeated NodeDrainState node_drains = 9;
  TenantQuotaProfile tenant_quota_profile = 10;
  repeated string active_features = 11;
  repeated SessionMetadataState session_metadata = 12;
  ConnectionRebalanceState connection_rebalance = 13;
  reserved 14;
  repeated ProposalOriginState proposal_origins = 15;
  repeated CredentialRevocationState credential_revocations = 16;
  repeated BlocklistState blocklist = 17;
  uint64 blocklist_version = 18;
  ClusterPolicyState cluster_policy = 19;
}
message SnapshotEnvelope {
  uint32 schema_major = 1;
  uint32 schema_minor = 2;
  uint64 last_included_index = 3;
  uint64 object_count = 4;
  bytes sha256 = 5;
  ReplicatedStateSnapshot state = 6;
}

message ProposalIdentity {
  uint64 origin_node_id = 1;
  uint64 proof_index = 2;
  uint64 retired_through = 3;
  bytes command_digest = 4;
  string request_id = 5;
}

message ProposalOriginState {
  uint64 origin_node_id = 1;
  uint64 retired_through = 2;
  repeated ProposalReceipt receipts = 3;
  uint64 rejected_through = 4;
  uint64 rejected_index = 5;
}

message ProposalReceipt {
  string request_id = 1;
  uint64 proof_index = 2;
  bytes command_digest = 3;
  ProposalResult result = 4;
}

message ProposalResult {
  uint64 index = 1;
  uint32 outcome = 2;
  string conflict = 3;
  MembershipRecord operation = 4;
  bool operation_replayed = 5;
  OwnershipState ownership = 6;
  SubscriptionState subscription = 7;
  ProposalDeliveryResult delivery = 8;
  ProposalOfflineClaim offline_claim = 9;
  NodeDrainState node_drain = 10;
  ProposalTenantQuotaRejection tenant_quota = 11;
  ProposalSessionMetadataResult session_metadata = 12;
  ConnectionRebalanceState connection_rebalance = 13;
  ProposalSupersededWill superseded_will = 14;
  uint64 operation_member_id = 15;
  string operation_phase = 16;
}

message ProposalDeliveryResult {
  bool found = 1;
  bool released = 2;
  repeated ProposalDeliveryEnqueued enqueued = 3;
  repeated string saturated = 4;
  repeated string skipped = 5;
  DeliverySessionState session = 6;
}

message ProposalDeliveryEnqueued {
  string client_id = 1;
  uint64 sequence = 2;
}

message ProposalOfflineClaim {
  bool found = 1;
  repeated OfflineMessage messages = 2;
}

message ProposalTenantQuotaRejection {
  string tenant_id = 1;
  string dimension = 2;
  uint64 profile_version = 3;
}

message ProposalSessionMetadataResult {
  bool found = 1;
  SessionWill will = 2;
}

message ProposalSupersededWill {
  SessionWill will = 1;
  SessionPrincipal principal = 2;
  uint32 protocol_version = 3;
  SessionRetention retention = 4;
  bool planned_handoff = 5;
}
