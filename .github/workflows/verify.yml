name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Resolve diff base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            base="$BEFORE_SHA"
          else
            base="HEAD"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "diff base: $base"
      - name: Run CI gate
        env:
          DIFF_BASE: ${{ steps.base.outputs.base }}
        run: go run ./tools/verify ci --base "$DIFF_BASE"
      - name: Run Python verification and record outcomes
        if: always()
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          NARUMQ_SCENARIO_RESULTS: .artifacts/verification/scenarios/python-ci-results.jsonl
        run: |
          python tests/run_scenario_unittest.py \
            tests/test_backup_s3.py \
            tests/test_eks_worker_recovery.py \
            tests/test_eks_capacity_controller.py \
            tests/test_eks_backup_dr.py \
            tests/test_eks_emptydir_guard.py \
            tests/test_eks_single_voter_stop_start.py \
            tests/test_feature_activation_decision.py \
            tests/test_eks_dashboard.py \
            tests/test_eks_nlb_drain.py \
            tests/test_eks_prestop_faults.py \
            tests/test_eks_pod_recreate.py \
            tests/chaos/eks-rollout-faults/test_replace_restart.py \
            tests/test_eks_rollout_ops.py \
            tests/test_eks_release_window.py \
            tests/test_eks_rolling_capacity.py \
            tests/test_scenario_results.py \
            tests/test_run_scenario_unittest.py
      - name: Combine Go and Python scenario outcomes
        if: always()
        shell: bash
        run: |
          inputs=()
          if [[ -f .artifacts/verification/go-test.json ]]; then
            inputs+=(--go-test-json .artifacts/verification/go-test.json)
          fi
          if [[ -f .artifacts/verification/scenarios/python-ci-results.jsonl ]]; then
            inputs+=(--results .artifacts/verification/scenarios/python-ci-results.jsonl)
          fi
          if (( ${#inputs[@]} == 0 )); then
            echo "No Go or Python execution results were produced." >&2
            exit 1
          fi
          go run ./tools/verify scenarios "${inputs[@]}" --require-executed
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/verification/coverage.out
            .artifacts/verification/coverage-summary.json
            .artifacts/verification/branch/manifest.json
            .artifacts/verification/go-test.json
            .artifacts/verification/scenarios/python-ci-results.jsonl
            .artifacts/verification/scenarios/report.md
            .artifacts/verification/scenarios/report.json
          if-no-files-found: warn
          retention-days: 30
