interface:
  display_name: "Artifact Design"
  short_description: "글·그림·여백으로 이어지는 편집 문서와 색상 변형, 설명용 동작을 담은 HTML 아티팩트 제작"
  default_prompt: "$artifact-design 이 주제를 글과 시각 자료가 함께 설명하는 단일 HTML 문서로 작성해 줘. 큰 장면, 문단 옆의 세부 도식, 콜라주와 여백을 조합하고, 한국어에 맞는 타이포그래피와 색상 팔레트를 선택해 줘. 의미 없는 선화나 장식은 넣지 마. 필요한 비교는 세로형 포스터 쌍으로 보여주고, 동작이나 관계는 단계 탐색과 사용자가 시작하는 애니메이션으로 설명해 줘. 모든 문단을 카드로 감싸거나 실제 근거 없는 지표를 추가하지 마."
