apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: narumq-backup-pvc
  namespace: narumq
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: narumq-backup
  namespace: narumq
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: narumq-backup
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: backup
              image: 809446814769.dkr.ecr.ap-northeast-2.amazonaws.com/narumq@sha256:09f77ae1e4d2277fb96192abaafbf3e2d1717683746ff8e6acc17efc9ccfa916
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - /scripts/backup.sh
              volumeMounts:
                - name: secrets
                  mountPath: /secrets
                  readOnly: true
                - name: backup-scripts
                  mountPath: /scripts
                  readOnly: true
                - name: backup-storage
                  mountPath: /backups
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: secrets
              secret:
                secretName: narumq-cluster-secrets
                defaultMode: 0440
                items:
                  - key: "admin.token"
                    path: "admin.token"
            - name: backup-scripts
              configMap:
                name: narumq-backup-scripts
                defaultMode: 0444
            - name: backup-storage
              persistentVolumeClaim:
                claimName: narumq-backup-pvc
