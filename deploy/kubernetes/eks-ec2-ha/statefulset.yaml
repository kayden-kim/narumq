apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: narumq
  namespace: narumq
spec:
  serviceName: narumq-headless
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app: narumq
  template:
    metadata:
      labels:
        app: narumq
    spec:
      terminationGracePeriodSeconds: 660
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: narumq
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: narumq
      initContainers:
        - name: select-peer-identity
          image: 809446814769.dkr.ecr.ap-northeast-2.amazonaws.com/narumq@sha256:7515ab8864da8a7f93d5ebc14b95a9f574b7c8b17ebbdc991032fc918716ce26
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /volume/data /volume/audit
              chown 10001:10001 /volume/data /volume/audit
              chmod 0770 /volume/data /volume/audit
              NODE_INDEX="$(hostname | awk -F'-' '{print $NF}')"
              cp "/tls-source/node-${NODE_INDEX}.crt" /peer-tls/node.crt
              cp "/tls-source/node-${NODE_INDEX}.key" /peer-tls/node.key
              cp /tls-source/ca.crt /peer-tls/ca.crt
              chmod 0440 /peer-tls/node.crt /peer-tls/node.key /peer-tls/ca.crt
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: cluster-secrets-source
              mountPath: /tls-source
              readOnly: true
            - name: peer-tls
              mountPath: /peer-tls
            - name: data
              mountPath: /volume
      containers:
        - name: narumq
          image: 809446814769.dkr.ecr.ap-northeast-2.amazonaws.com/narumq@sha256:7515ab8864da8a7f93d5ebc14b95a9f574b7c8b17ebbdc991032fc918716ce26
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              NODE_INDEX="$(hostname | awk -F'-' '{print $NF}')"
              exec /narumq -cluster-config "/configs/node-$((NODE_INDEX + 1)).json"
          ports:
            - name: raft-peer
              containerPort: 7000
              protocol: TCP
            - name: mqtt-tcp
              containerPort: 1883
              protocol: TCP
            - name: http-mgmt
              containerPort: 8080
              protocol: TCP
            - name: mqtt-ws
              containerPort: 8083
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    NODE_INDEX="$(hostname | awk -F'-' '{print $NF}')"
                    NODE_ID="$((NODE_INDEX + 1))"
                    IDEMPOTENCY_KEY="prestop-${NODE_ID}-$(cat /proc/sys/kernel/random/uuid)"
                    curl --fail --silent --show-error --max-time 600 \
                      -X POST "http://127.0.0.1:8080/api/v1/nodes/${NODE_ID}/drain" \
                      -H "Authorization: Bearer $(cat /secrets/admin.token)" \
                      -H "Idempotency-Key: ${IDEMPOTENCY_KEY}" \
                      -H "Content-Type: application/json" \
                      --data '{}'
          startupProbe:
            httpGet:
              path: /health/startup
              port: http-mgmt
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: http-mgmt
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http-mgmt
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "1"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: configs
              mountPath: /configs
              readOnly: true
            - name: cluster-secrets
              mountPath: /secrets
              readOnly: true
            - name: peer-tls
              mountPath: /peer-tls
              readOnly: true
            - name: data
              mountPath: /data
              subPath: data
            - name: data
              mountPath: /audit
              subPath: audit
      volumes:
        - name: configs
          configMap:
            name: narumq-cluster-configs
            defaultMode: 0444
        - name: cluster-secrets-source
          secret:
            secretName: narumq-cluster-secrets
            defaultMode: 0400
            items:
              - key: ca.crt
                path: ca.crt
              - key: node-0.crt
                path: node-0.crt
              - key: node-0.key
                path: node-0.key
              - key: node-1.crt
                path: node-1.crt
              - key: node-1.key
                path: node-1.key
              - key: node-2.crt
                path: node-2.crt
              - key: node-2.key
                path: node-2.key
        - name: cluster-secrets
          secret:
            secretName: narumq-cluster-secrets
            defaultMode: 0440
            items:
              - key: admin.token
                path: admin.token
              - key: dashboard.key
                path: dashboard.key
              - key: security.json
                path: security.json
        - name: peer-tls
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: gp3
        resources:
          requests:
            storage: 20Gi
