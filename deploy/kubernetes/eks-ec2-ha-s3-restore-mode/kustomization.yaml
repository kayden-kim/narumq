apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../eks-ec2-ha-s3
  - ../eks-ec2-ha-restore-targets
patches:
  - path: statefulset-paused.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: narumq
      namespace: narumq
  - path: cronjob-suspended.yaml
    target:
      group: batch
      version: v1
      kind: CronJob
      name: narumq-backup
      namespace: narumq
