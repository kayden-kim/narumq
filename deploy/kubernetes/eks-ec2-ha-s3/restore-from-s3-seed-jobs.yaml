apiVersion: batch/v1
kind: Job
metadata:
  generateName: narumq-backup-restore-node-1-
  namespace: narumq
  labels:
    app.kubernetes.io/name: narumq-backup
    app.kubernetes.io/component: restore-seed
spec:
  activeDeadlineSeconds: 3600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: narumq-backup
        app.kubernetes.io/component: restore-seed
      annotations:
        eks.amazonaws.com/skip-containers: restore,prepare-target
    spec:
      serviceAccountName: narumq-backup-restore
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: download-from-s3
          image: amazon/aws-cli:2.37.9@sha256:92de75724b6a746951f0e8b915d86bbccd7cb55aff96cd0cb4f7017272160780
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /scripts/restore-from-s3.py
          args:
            - download
            - $(BACKUP_S3_KEY)
            - /restore
          envFrom:
            - configMapRef:
                name: narumq-backup-config
          env:
            - name: BACKUP_S3_KEY
              valueFrom:
                configMapKeyRef:
                  name: narumq-backup-restore-request
                  key: BACKUP_S3_KEY
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: backup-scripts
              mountPath: /scripts
              readOnly: true
            - name: restore-archive
              mountPath: /restore
            - name: tmp
              mountPath: /tmp
        - name: prepare-target
          image: 809446814769.dkr.ecr.ap-northeast-2.amazonaws.com/narumq@sha256:09f77ae1e4d2277fb96192abaafbf3e2d1717683746ff8e6acc17efc9ccfa916
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              if [ -n "$(find /volume -mindepth 1 -maxdepth 1 ! -name data ! -name audit ! -name lost+found -print -quit)" ]; then
                echo "restore PVC contains unexpected root entries; refusing to proceed" >&2
                exit 1
              fi
              if [ -e /volume/lost+found ] && [ ! -d /volume/lost+found ]; then
                echo "restore PVC lost+found entry is not a directory; refusing to proceed" >&2
                exit 1
              fi
              for target in /volume/data /volume/audit; do
                if [ -e "${target}" ]; then
                  if [ ! -d "${target}" ] || [ -n "$(find "${target}" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                    echo "restore target is not empty: ${target}" >&2
                    exit 1
                  fi
                fi
              done
              mkdir -p /volume/data /volume/audit
              chown 10001:10001 /volume/data /volume/audit
              chmod 0770 /volume/data /volume/audit
              cp /tls-source/node-0.crt /peer-tls/node.crt
              cp /tls-source/node-0.key /peer-tls/node.key
              cp /tls-source/ca.crt /peer-tls/ca.crt
              chmod 0440 /peer-tls/node.crt /peer-tls/node.key /peer-tls/ca.crt
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: cluster-secrets-source
              mountPath: /tls-source
              readOnly: true
            - name: peer-tls
              mountPath: /peer-tls
            - name: data
              mountPath: /volume
      containers:
        - name: restore
          image: 809446814769.dkr.ecr.ap-northeast-2.amazonaws.com/narumq@sha256:09f77ae1e4d2277fb96192abaafbf3e2d1717683746ff8e6acc17efc9ccfa916
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              set -- /restore/backup-*.nrbak
              if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
                echo "expected exactly one verified S3 archive in /restore" >&2
                exit 1
              fi
              exec /narumq -cluster-config /configs/node-1.json -cluster-restore "$1"
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "1"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: configs
              mountPath: /configs
              readOnly: true
            - name: cluster-secrets
              mountPath: /secrets
              readOnly: true
            - name: peer-tls
              mountPath: /peer-tls
              readOnly: true
            - name: restore-archive
              mountPath: /restore
              readOnly: true
            - name: data
              mountPath: /data
              subPath: data
            - name: data
              mountPath: /audit
              subPath: audit
      volumes:
        - name: backup-scripts
          configMap:
            name: narumq-backup-scripts
            defaultMode: 0444
        - name: restore-archive
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: configs
          configMap:
            name: narumq-cluster-configs
            defaultMode: 0444
        - name: cluster-secrets-source
          secret:
            secretName: narumq-cluster-secrets
            defaultMode: 0400
            items:
              - key: ca.crt
                path: ca.crt
              - key: node-0.crt
                path: node-0.crt
              - key: node-0.key
                path: node-0.key
        - name: cluster-secrets
          secret:
            secretName: narumq-cluster-secrets
            defaultMode: 0440
            items:
              - key: admin.token
                path: admin.token
              - key: dashboard.key
                path: dashboard.key
              - key: security.json
                path: security.json
        - name: peer-tls
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: data-narumq-0
---
