apiVersion: apps/v1
kind: Deployment
metadata:
  name: narumq-rollout-controller
  namespace: narumq
  labels:
    app.kubernetes.io/name: narumq-rollout-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: narumq-rollout-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: narumq-rollout-controller
    spec:
      serviceAccountName: narumq-rollout-controller
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: narumq-rollout-controller
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: NARUMQ_AUDIT_DIRECTORY
              value: /var/lib/narumq/audit
            - name: NARUMQ_ALLOWED_OCI_REGISTRIES
              value: https://809446814769.dkr.ecr.ap-northeast-2.amazonaws.com
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: audit
              mountPath: /var/lib/narumq/audit
      volumes:
        - name: audit
          persistentVolumeClaim:
            claimName: narumq-rollout-audit
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: narumq-rollout-audit
  namespace: narumq
  labels:
    app.kubernetes.io/name: narumq-rollout-controller
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 10Gi
