apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../crd.yaml
  - ../../rbac.yaml
  - ../../deployment.yaml
configMapGenerator:
  - name: narumq-rollout-controller-release-input
    envs:
      - controller-image.env
generatorOptions:
  disableNameSuffixHash: true
replacements:
  - source:
      kind: ConfigMap
      name: narumq-rollout-controller-release-input
      fieldPath: data.CONTROLLER_IMAGE
    targets:
      - select:
          group: apps
          version: v1
          kind: Deployment
          name: narumq-rollout-controller
        fieldPaths:
          - spec.template.spec.containers.[name=controller].image
