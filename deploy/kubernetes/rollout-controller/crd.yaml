apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: narumqrollouts.narumq.io
spec:
  group: narumq.io
  scope: Namespaced
  names:
    plural: narumqrollouts
    singular: narumqrollout
    kind: NaruMQRollout
    shortNames:
      - nmr
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Workload
          type: string
          jsonPath: .spec.workloadRef.name
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ordinal
          type: integer
          jsonPath: .status.currentOrdinal
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - workloadRef
                - target
                - imagePullSecretRef
                - management
                - retryToken
              properties:
                workloadRef:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                      pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
                target:
                  type: object
                  required: [image, releaseVersion, features]
                  properties:
                    image:
                      type: string
                      maxLength: 512
                      pattern: '^.+@sha256:[a-f0-9]{64}$'
                    releaseVersion:
                      type: string
                      maxLength: 64
                      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
                    features:
                      type: array
                      minItems: 1
                      maxItems: 64
                      x-kubernetes-list-type: set
                      items:
                        type: string
                        maxLength: 63
                        pattern: '^[a-z][a-z0-9-]*$'
                imagePullSecretRef:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                      pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
                management:
                  type: object
                  required: [endpoint, credentialSecretRef]
                  properties:
                    endpoint:
                      type: string
                      maxLength: 512
                      pattern: '^http://narumq-management\.[a-z0-9]([-a-z0-9]*[a-z0-9])?\.svc(\.cluster\.local)?:8080/?$'
                    credentialSecretRef:
                      type: object
                      required: [name]
                      properties:
                        name:
                          type: string
                          minLength: 1
                          maxLength: 253
                          pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
                retryToken:
                  type: string
                  minLength: 1
                  maxLength: 256
                abort:
                  type: boolean
            status:
              type: object
              properties:
                phase:
                  type: string
                  maxLength: 32
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                attemptKey:
                  type: string
                  maxLength: 128
                retryTokenHash:
                  type: string
                  maxLength: 64
                currentOrdinal:
                  type: integer
                  format: int32
                  minimum: 0
                  maximum: 2
                currentPodName:
                  type: string
                  maxLength: 253
                currentPodUID:
                  type: string
                  maxLength: 64
                currentPodResourceVersion:
                  type: string
                  maxLength: 128
                drainOperationID:
                  type: string
                  maxLength: 128
                drainIntentAt:
                  type: string
                  format: date-time
                drainStartedAt:
                  type: string
                  format: date-time
                drainDeadlineAt:
                  type: string
                  format: date-time
                drainPhase:
                  type: string
                  maxLength: 64
                drainState:
                  type: string
                  maxLength: 32
                drainSafeToStop:
                  type: boolean
                safeToStopObservedAt:
                  type: string
                  format: date-time
                approvalDeadlineAt:
                  type: string
                  format: date-time
                drainConnectionsInitial:
                  type: integer
                  format: int64
                  minimum: 0
                drainConnectionsRemaining:
                  type: integer
                  format: int64
                  minimum: 0
                drainSessionsReady:
                  type: integer
                  format: int64
                  minimum: 0
                drainSessionsTakenOver:
                  type: integer
                  format: int64
                  minimum: 0
                drainSessionsFailed:
                  type: integer
                  format: int64
                  minimum: 0
                drainPendingWAL:
                  type: integer
                  format: int64
                  minimum: 0
                drainUnderReplicated:
                  type: integer
                  format: int64
                  minimum: 0
                drainFailureCode:
                  type: string
                  maxLength: 128
                drainBlockingReason:
                  type: string
                  maxLength: 256
                deleteIntent:
                  type: boolean
                failureCode:
                  type: string
                  maxLength: 128
                failureReason:
                  type: string
                  maxLength: 512
                completedOrdinals:
                  type: array
                  maxItems: 3
                  x-kubernetes-list-type: set
                  items:
                    type: integer
                    format: int32
                    minimum: 0
                    maximum: 2
                targetImage:
                  type: string
                  maxLength: 512
                targetVersion:
                  type: string
                  maxLength: 64
                targetFeatures:
                  type: array
                  maxItems: 64
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    maxLength: 63
                workloadUID:
                  type: string
                  maxLength: 64
                workloadName:
                  type: string
                  maxLength: 253
                registrySecretName:
                  type: string
                  maxLength: 253
                managementEndpoint:
                  type: string
                  maxLength: 512
                managementSecretName:
                  type: string
                  maxLength: 253
                workloadGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                lastTransitionTime:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  maxItems: 8
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type:
                        type: string
                        maxLength: 64
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                        maxLength: 128
                      message:
                        type: string
                        maxLength: 512
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      lastTransitionTime:
                        type: string
                        format: date-time
